databases:
  - name: verifai-postgres
    databaseName: verifai_v2
    user: verifai

services:
  - type: web
    name: verifai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: verifai-postgres
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: openai/gpt-4o
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: verifai-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: verifai-redis
          property: connectionString

  - type: worker
    name: verifai-celery-worker
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker.celery_app worker --pool=solo --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: verifai-postgres
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: verifai-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: verifai-redis
          property: connectionString

  - type: worker
    name: verifai-celery-beat
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: verifai-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: verifai-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: verifai-redis
          property: connectionString

  - type: redis
    name: verifai-redis
    ipAllowList: []
